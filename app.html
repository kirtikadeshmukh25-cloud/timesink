<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeSink — Planner</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

  <header class="app-topbar">
    <a href="index.html" class="brand">
      <i data-lucide="clock"></i>
      <span>TimeSink</span>
    </a>
    <button id="clearBtn" class="btn ghost">
      <i data-lucide="trash-2"></i> Clear Day
    </button>
  </header>

  <main class="app-container">
    
    <!-- LEFT: TIMELINE -->
    <section class="timeline-panel">
      <div class="timeline-header">
        <h2>Your Day</h2>
        <div class="category-selector">
          <label for="categorySelect">Category:</label>
          <select id="categorySelect">
            <option value="work">Work (Blue)</option>
            <option value="sleep">Sleep (Purple)</option>
            <option value="break">Break (Green)</option>
            <option value="personal">Personal (Orange)</option>
          </select>
        </div>
      </div>
      
      <div class="timeline-container" id="timelineContainer">
        <!-- Hours generated by JS -->
        <div class="timeline-blocks" id="timelineBlocks"></div>
      </div>
    </section>

    <!-- RIGHT: INSIGHTS -->
    <section class="insights-panel">
      <h2><i data-lucide="bar-chart-2"></i> Insights</h2>
      
      <div class="insight-card">
        <h3>Total Scheduled</h3>
        <p class="big-number" id="totalHours">0.0 hours</p>
      </div>

      <div class="insight-breakdown">
        <div class="breakdown-item">
          <span class="dot work"></span> Work
          <span id="countWork">0.0h</span>
        </div>
        <div class="breakdown-item">
          <span class="dot sleep"></span> Sleep
          <span id="countSleep">0.0h</span>
        </div>
        <div class="breakdown-item">
          <span class="dot break"></span> Break
          <span id="countBreak">0.0h</span>
        </div>
        <div class="breakdown-item">
          <span class="dot personal"></span> Personal
          <span id="countPersonal">0.0h</span>
        </div>
      </div>

      <div class="alerts" id="alerts">
        <!-- Warnings appear here -->
      </div>
    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
